<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cross-Canada Timeline</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <header class="brand">
      <div class="brand-mark">◈</div>
      <div class="brand-text">
        <h1>Cross&#8209;Canada Road Trip 2026</h1>
        <span>Timeline Explorer</span>
      </div>
    </header>

    <section class="stats-bar" id="statsBar">
      <div class="stat">
        <span class="stat-value" id="statDistance">—</span>
        <span class="stat-label">km travelled</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statDays">—</span>
        <span class="stat-label">days tracked</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statVisits">—</span>
        <span class="stat-label">stops</span>
      </div>
    </section>

    <section class="calendar-panel">
      <div class="calendar-nav">
        <button id="prevMonth" class="nav-btn" aria-label="Previous month">&#8249;</button>
        <span id="monthLabel" class="month-label">—</span>
        <button id="nextMonth" class="nav-btn" aria-label="Next month">&#8250;</button>
      </div>
      <div class="weekday-row">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="selection-panel" id="selectionPanel">
      <div class="selection-header">
        <span id="selectionTitle">Entire trip</span>
        <button id="clearSelection" class="clear-btn" hidden>Show all</button>
      </div>
      <div id="selectionMeta" class="selection-meta"></div>
      <div id="visitList" class="visit-list"></div>
    </section>

    <footer class="legend">
      <div class="legend-item"><span class="dot mode-1"></span>Driving</div>
      <div class="legend-item"><span class="dot mode-2"></span>Walking</div>
      <div class="legend-item"><span class="dot mode-3"></span>Ferry</div>
      <div class="legend-item"><span class="dot mode-4"></span>Bus</div>
      <div class="legend-item"><span class="dot mode-poi"></span>Point of interest</div>
    </footer>
  </aside>

  <main id="mapPane">
    <div id="map"></div>
    <div id="mapOverlay">
      <div id="dayTitle" class="day-title" hidden></div>
    </div>
    <div id="loadingScreen">
      <div class="loader"></div>
      <span>Loading timeline…</span>
    </div>
  </main>

</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
